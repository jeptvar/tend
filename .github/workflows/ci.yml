name: ci

on:
  push:
    # Dependabot's branches get their run from the pull request it opens for each one.
    branches-ignore:
      - "dependabot/**"
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke

  # npm create tend, as a person runs it, from the packages as they'd be published, with the
  # shrinkwrap the release generates (PLAN.md §14). It needs the npm registry.
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm shrinkwrap
      - run: pnpm smoke:create
      # The release's last check before publishing, so that it's known to work by then.
      - name: Check npm create tend with a release that's an hour old
        shell: bash
        run: |
          mkdir packed
          npm pack ./packages/tendcms ./packages/create-tend --pack-destination packed
          node scripts/smoke-registry.mjs --packages packed
      # The installer has to run on a Node.js that's too old for Tend, to say so.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - name: Check an old Node.js is told what to install
        shell: bash
        run: |
          if node packages/create-tend/dist/index.mjs too-old > old.log 2>&1; then
            echo "create-tend went on with Node.js $(node --version)."
            exit 1
          fi
          grep --quiet 'Tend needs Node.js 24 or newer' old.log
          test ! -e too-old

  # One job per browser, side by side: the tests take most of a quarter of an hour in each.
  browser:
    name: browser (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps "$BROWSER"
      - run: pnpm e2e --project="$BROWSER"
      # Traces show what the page did, which the log alone can't, so a failure can be
      # understood without reproducing it first.
      - name: Keep the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # PLAN.md §11's budgets that can be counted exactly: what the admin and the theme weigh,
  # and what visitors download from pages made with each starting point. Lighthouse's scores
  # and timings vary from run to run, so they're checked nightly instead (lighthouse.yml).
  budgets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm size
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project=budgets
      - name: Keep the traces and measurements of failed budget checks
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-budgets
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Known vulnerabilities in anything the lockfiles install, the published package's bundled
  # libraries included (PLAN.md §12), and Lighthouse's own install for the nightly check. An
  # ignore needs a date and a reason, in osv-scanner.toml.
  vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
            --lockfile=tools/lighthouse/pnpm-lock.yaml

  # The image as it would be published, built on each processor it's published for, each
  # natively (GitHub's arm64 runners are free for public repositories). PLAN.md §13 and §14.
  docker-image:
    name: docker (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # Trivy's own image, pinned by digest.
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      # Only what has a fix. Its database comes from AWS's mirror first, since GHCR
      # rate-limits it.
      TRIVY_FLAGS: >-
        --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
        --db-repository public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file docker/Dockerfile --tag tend:test .
      - name: Boot the image and check it serves the site
        run: |
          docker run --detach --name tend --publish 3000:3000 tend:test
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/healthz
          curl --fail --silent --show-error http://127.0.0.1:3000/admin/setup | grep --quiet 'id="root"'
          docker exec tend tendcms setup-code | grep --quiet --extended-regexp '^[0-9A-Z]{4}-[0-9A-Z]{4}$'
          test "$(docker exec tend id --user --name)" = node
          # npm installs Tend and then goes: it isn't needed to run it. (Not `! command`:
          # a step's -e ignores a negated command, so that could never fail.)
          if docker exec tend sh -c 'command -v npm'; then
            echo "npm is still in the image."
            exit 1
          fi
      # What's downloaded, with each layer compressed (PLAN.md §11).
      - name: Check the image's size
        run: |
          bytes=$(docker save tend:test | gzip | wc --bytes)
          echo "$((bytes / 1000000)) MB compressed"
          test "$bytes" -le 200000000
      # A folder from the server, or a volume a host makes (Railway's), belongs to root.
      - name: Boot against a data folder that belongs to root
        run: |
          sudo mkdir /srv/tend-data
          # As node, Tend can't write there, so it stops and says how to fix it.
          if docker run --rm --volume /srv/tend-data:/data tend:test > refused.log 2>&1; then
            echo "Tend started on a data folder it can't write to."
            exit 1
          fi
          grep --quiet 'sudo chown -R 1000:1000' refused.log
          # tendcms doctor explains it too, and fails, without starting Tend.
          if docker run --rm --volume /srv/tend-data:/data tend:test tendcms doctor > doctor.log 2>&1
          then
            echo "tendcms doctor found nothing to fix in a data folder Tend can't write to."
            exit 1
          fi
          grep --quiet '^FIX .*sudo chown -R 1000:1000' doctor.log
          # As root, the way Railway runs it with RAILWAY_RUN_UID=0, it works.
          docker run --detach --name tend-root --user 0 --publish 3001:3000 \
            --volume /srv/tend-data:/data tend:test
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3001/healthz && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:3001/admin/setup | grep --quiet 'id="root"'
          sudo test -f /srv/tend-data/tend.db
      # Two containers on one volume would write over each other's changes. The lock is the
      # operating system's, so it has to hold between containers too (PLAN.md §11).
      - name: Check two containers can't use one volume
        run: |
          docker run --detach --name tend-first --publish 3004:3000 \
            --volume tend-shared:/data tend:test
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:3004/healthz
          if timeout 60 docker run --rm --volume tend-shared:/data tend:test > second.log 2>&1; then
            echo "A second container started on a volume that's in use."
            exit 1
          fi
          grep --quiet 'Tend is already running with this data folder' second.log
          # The first one didn't notice, and stops the way a host asks it to, in its own time.
          curl --fail --silent --show-error http://127.0.0.1:3004/healthz
          docker stop tend-first
          test "$(docker inspect --format '{{.State.ExitCode}}' tend-first)" = 0
          # Then the volume is free.
          docker run --detach --name tend-next --publish 3005:3000 \
            --volume tend-shared:/data tend:test
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:3005/healthz
          docker stop tend-next
      # A container's own files go when it's replaced, and so can a volume with no name, which
      # is what Docker makes for the image's /data when it isn't given one. Each container is
      # stopped before its log is read, so it has nothing left to write.
      - name: Check it says when the site could be lost
        run: |
          # The admin tells an Admin, so there has to be one.
          cat > setup.json <<JSON
          {
            "code": "$(docker exec tend tendcms setup-code)",
            "site": { "name": "Test", "tagline": "", "locale": "en", "timezone": "UTC" },
            "owner": {
              "name": "Sam Lee",
              "email": "sam@example.com",
              "password": "maple-river-candle-stone-orbit"
            },
            "starter": "blank"
          }
          JSON
          curl --fail --silent --show-error --output /dev/null --cookie-jar cookies.txt \
            --header 'Content-Type: application/json' --data @setup.json \
            http://127.0.0.1:3000/api/auth/setup
          curl --fail --silent --show-error --cookie cookies.txt http://127.0.0.1:3000/api/auth/me |
            grep --quiet '"dataRisk":{"why":"unnamed","path":"/data","platform":"docker"}'
          # A theme of someone's own goes on the volume, and Design offers it.
          docker exec tend tendcms theme copy meadow my-theme
          docker exec tend test -f /data/themes/my-theme/theme.json
          curl --fail --silent --show-error --cookie cookies.txt http://127.0.0.1:3000/api/admin/design |
            grep --quiet '"id":"my-theme","name":"My theme"'
          docker run --detach --name tend-unmounted --publish 3002:3000 \
            --env TEND_DATA_DIR=/tmp/site tend:test
          docker run --detach --name tend-named --publish 3003:3000 \
            --volume tend-data:/data tend:test
          for port in 3002 3003; do
            curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
              "http://127.0.0.1:$port/healthz"
          done
          # Beside a running Tend, tendcms doctor says the same.
          docker exec tend tendcms doctor | grep '^FIX .*/data is on a volume with no name'
          docker exec tend-unmounted tendcms doctor | grep "^FIX .*/tmp/site isn't on a volume"
          docker exec tend-named tendcms doctor | tee doctor-named.log
          grep --quiet '^OK .*The site is kept' doctor-named.log
          grep --quiet '^OK .*Tend is running here' doctor-named.log
          docker stop tend tend-root tend-unmounted tend-named
          docker logs tend 2>&1 | grep --quiet 'WARNING: /data is on a volume with no name'
          docker logs tend-unmounted 2>&1 | grep --quiet "WARNING: /tmp/site isn't on a volume"
          # A folder of the server's and a volume with a name are both kept.
          for kept in tend-root tend-named; do
            if docker logs "$kept" 2>&1 | grep WARNING; then
              echo "$kept was warned about a data folder that's kept."
              exit 1
            fi
          done
      # A scan that always passes looks the same as a clean image, so first it has to find
      # lodash 4.17.4, which has known vulnerabilities with fixes. The exit code is one Trivy
      # doesn't use for its own errors, like a database it couldn't download.
      - name: Check the scan can fail
        run: |
          mkdir "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/canary"
          cat > "$RUNNER_TEMP/canary/package-lock.json" <<'JSON'
          {
            "name": "canary",
            "version": "1.0.0",
            "lockfileVersion": 3,
            "packages": {
              "": { "name": "canary", "version": "1.0.0", "dependencies": { "lodash": "4.17.4" } },
              "node_modules/lodash": { "version": "4.17.4" }
            }
          }
          JSON
          status=0
          docker run --rm --volume "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
            --volume "$RUNNER_TEMP/canary:/canary:ro" \
            "$TRIVY" filesystem $TRIVY_FLAGS --exit-code 42 /canary || status=$?
          if [ "$status" != 42 ]; then
            echo "Trivy didn't find a package with known vulnerabilities (it exited with $status)."
            exit 1
          fi
      # Known vulnerabilities (PLAN.md §12) in Debian's packages and Tend's npm packages. Not
      # in Node.js itself: the image takes the newest 26.x whenever it's built.
      - name: Scan the image for known vulnerabilities
        run: |
          docker run --rm --volume "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY" image $TRIVY_FLAGS --exit-code 1 tend:test
      - name: Show what Tend printed, if that failed
        if: failure()
        run: |
          for name in tend tend-root tend-first tend-next tend-unmounted tend-named; do
            docker logs "$name" || true
          done
          cat refused.log doctor.log second.log || true

  # main's rules require one check called docker, and this is it: it passes only if both
  # processors' images did. Without always() it would be skipped when one fails, and GitHub
  # counts a skipped check as passed.
  docker:
    needs: docker-image
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Both processors' images passed
        env:
          RESULT: ${{ needs.docker-image.result }}
        run: test "$RESULT" = success
