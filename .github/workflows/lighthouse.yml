name: lighthouse

# Lighthouse on every starting point and a post (PLAN.md §11). Its scores and timings vary
# from run to run, so it runs nightly and on release tags rather than on every pull request,
# which gets the budgets that can be counted exactly (the budgets job in ci.yml). It also runs
# on a pull request that changes how it's run, and by hand from the Actions tab.
on:
  schedule:
    - cron: "23 3 * * *"
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/lighthouse.yml"
      - "e2e/lighthouse.spec.ts"
      - "e2e/starter-sites.ts"
      - "playwright.lighthouse.config.ts"
      - "tools/lighthouse/**"
  workflow_dispatch:

permissions: {}

jobs:
  # A night after a day with no commits would only measure the same code again.
  changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$age" -lt 90000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  lighthouse:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/lighthouse/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Lighthouse has its own install, so the rest of the repo doesn't carry its packages.
      - run: pnpm install --frozen-lockfile
        working-directory: tools/lighthouse
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lighthouse
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: test-results/lighthouse/
          retention-days: 14
          if-no-files-found: ignore
