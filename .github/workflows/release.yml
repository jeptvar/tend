name: release

# A release (PLAN.md §14): a signed tag on main, like v0.1.0, and then everything else is done
# here. It's checked, built and tried the way people will install it before anything is
# published, publishing waits for a person's click (the release environment), and what's on npm
# is tried again afterwards. docs/releasing.md has the steps around it.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is signed, and on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object | select(.type == "tag") | .sha')
          if [ -z "$tag" ]; then
            echo "$TAG isn't a signed tag: git tag --sign $TAG"
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .verification.verified)" != true ]; then
            echo "GitHub can't verify the signature on $TAG."
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: It's the same version everywhere
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$TAG" --notes notes.md
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md

  # With nothing kept from other runs, so that nothing but the tag decides what's in it.
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm shrinkwrap
      - run: |
          mkdir packed
          npm pack ./packages/tendcms ./packages/create-tend --pack-destination packed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packed/*.tgz

  # The way people will install it, from a registry where it's an hour old. If this fails,
  # nothing is published.
  try:
    name: try (${{ matrix.os }})
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packed
      - run: node scripts/smoke-registry.mjs --packages packed

  publish:
    needs: [check, try]
    runs-on: ubuntu-latest
    # Somebody has to approve it.
    environment: release
    permissions:
      # npm's trusted publishing: GitHub says which workflow this is, so there's no token.
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packed
      # tendcms first: create-tend installs the tendcms of its own version. One that's there
      # already, when this is run again after it stopped halfway, is left as it is.
      - name: Publish tendcms, then create-tend
        run: |
          case "$VERSION" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          for name in tendcms create-tend; do
            if npm view "$name@$VERSION" version > /dev/null 2>&1; then
              echo "$name $VERSION is on npm already."
            else
              npm publish "packed/$name-$VERSION.tgz" --access public --tag "$tag"
            fi
          done

  image:
    needs: [check, publish]
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.check.outputs.version }}

  # What's on npm now, on every system. If this fails, the release is deprecated and a patch
  # follows: docs/releasing.md.
  published:
    name: published (${{ matrix.os }})
    needs: [check, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - shell: bash
        run: node scripts/smoke-create.mjs --published "$VERSION"

  announce:
    needs: [check, image, published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - name: Put what changed on the release's page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          case "$VERSION" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          gh release create "$TAG" --verify-tag "$kind" --title "Tend $VERSION" --notes-file notes.md
