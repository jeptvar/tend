name: docker

# The image people run (PLAN.md §13): the tendcms that's on npm, in an image for each kind of
# processor, on GitHub's container registry. release.yml runs it for a release. Every week it's
# made again for the newest one, to take Debian's and Node.js's security fixes since.
on:
  workflow_call:
    inputs:
      version:
        description: The version that's on npm, like 0.1.0.
        required: true
        type: string
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

# Never two at once: both would move the same tags.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.find.outputs.version }}
      tags: ${{ steps.find.outputs.tags }}
      image: ${{ steps.find.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: find
        env:
          GIVEN: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Without one given, the newest release there is. Before the first, there's none.
          version="${GIVEN:-$(git tag --list 'v[0-9]*' --sort=-version:refname | grep --invert-match -- - | head -n 1 | sed 's/^v//')}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/tend" >> "$GITHUB_OUTPUT"
          # 0.1.3 is also 0.1, 0 and latest. A version that's only tried out is just itself.
          case "$version" in
            *-*) echo "tags=$version" ;;
            *) echo "tags=$version ${version%.*} ${version%%.*} latest" ;;
          esac >> "$GITHUB_OUTPUT"

  image:
    name: image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      ARCH: ${{ matrix.arch }}
      # Trivy's own image, pinned by digest, as in ci.yml, which shows that this scan can fail.
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      TRIVY_FLAGS: >-
        --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
        --db-repository public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: v${{ needs.version.outputs.version }}
      # The very package people install, with its shrinkwrap, rather than one like it made here.
      # One just published isn't everywhere on npm at once.
      - name: Get the package from npm
        run: |
          mkdir pack
          for _ in $(seq 1 10); do
            npm pack "tendcms@$VERSION" --pack-destination pack && break
            sleep 30
          done
          test -f "pack/tendcms-$VERSION.tgz"
      - run: docker build --pull --file docker/Dockerfile --build-arg PACKAGE=published --tag tend:release .
      - name: Boot it and check it serves the site
        run: |
          docker run --detach --name tend --publish 3000:3000 tend:release
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors \
            http://127.0.0.1:3000/healthz | grep --quiet "\"version\":\"$VERSION\""
          curl --fail --silent --show-error http://127.0.0.1:3000/admin/setup | grep --quiet 'id="root"'
          docker stop tend
      - name: Scan it for known vulnerabilities
        run: |
          mkdir "$RUNNER_TEMP/trivy"
          docker run --rm --volume "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY" image $TRIVY_FLAGS --exit-code 1 tend:release
      # By processor for now. Nobody's told to use these, and the next job puts them together.
      - name: Push it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag tend:release "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"
      - name: Show what Tend printed, if that failed
        if: failure()
        run: docker logs tend || true

  # One name for both, so whoever pulls it gets the one for their processor.
  tags:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      TAGS: ${{ needs.version.outputs.tags }}
    steps:
      - name: Put them together under every tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for tag in $TAGS; do
            docker buildx imagetools create --tag "$IMAGE:$tag" \
              "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          done
          docker buildx imagetools inspect "$IMAGE:$VERSION"
