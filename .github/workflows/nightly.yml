name: nightly

# What varies too much from run to run for a pull request to wait on: how long things take
# (PLAN.md §11), and how Tend does on the Node.js that's still being made (PLAN.md §14).
# Lighthouse has a workflow of its own. It also runs on a pull request that changes how it's
# run, and by hand from the Actions tab.
on:
  schedule:
    - cron: "53 3 * * *"
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"
      - "e2e/timings.spec.ts"
      - "scripts/bench.mjs"
  workflow_dispatch:

permissions: {}

jobs:
  # A night after a day with no commits would only measure the same code again.
  changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$age" -lt 90000 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  timings:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Kept and fresh pages, pages while a backup is made, and how many in a second.
      - run: node scripts/bench.mjs
      - run: pnpm exec playwright install --with-deps chromium
      # Publishing, saving and typing. One at a time, so they don't slow each other down.
      - run: pnpm e2e --project=timings --workers=1
      - name: Keep the traces of timings that were too slow
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-timings
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The next Node.js before it's out, so that what breaks is known early. Nothing depends on
  # it, and Node.js itself can be what's broken that night.
  next-node:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 27-nightly
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
