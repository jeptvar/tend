version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Tiptap's packages only work at the same version as each other, so they move together.
      tiptap:
        patterns:
          - "@tiptap/*"
      # Every other minor and patch update comes in one pull request a week, so CI runs once
      # for them all instead of once each. A major update still gets a pull request of its own.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Kept at the oldest Node the package supports, so code can't use newer Node APIs.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # 1.65.0's WebKit stops 20 browser tests with an "Assertion error" from inside
      # Playwright as a page loads. Only that version, so a fixed one still comes through.
      - dependency-name: "@playwright/test"
        versions:
          - "1.65.0"
  # Lighthouse's own install, for the nightly check. Its pull requests run that check.
  - package-ecosystem: npm
    directory: /tools/lighthouse
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      lighthouse:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
