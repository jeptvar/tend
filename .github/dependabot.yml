version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # Tiptap's packages only work at the same version as each other, so they move together.
      tiptap:
        patterns:
          - "@tiptap/*"
    ignore:
      # Kept at the oldest Node the package supports, so code can't use newer Node APIs.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
  # Lighthouse's own install, for the nightly check. Its pull requests run that check.
  - package-ecosystem: npm
    directory: /tools/lighthouse
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
